/* ============================================================
   נמדד מהאתר: רקע #0F012F שטוח לגמרי · מנטה #70D3A5 · טקסט לבן
   כפתור: 48% מהרוחב, יחס 3.47:1, רדיוס 7% מהגובה, תווית לבנה
   ============================================================ */
:root{
  --ground:#0F012F;
  --surface:#170634;
  --panel:#1C0940;
  --card:#1E0B41;
  --mint:#70D3A5;
  --white:#FFFFFF;
  --muted:rgba(255,255,255,.42);
  --line:rgba(255,255,255,.22);
  --font:'Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,.72,.26,1);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--white);font-family:var(--font);
  -webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:flex-start;
  padding:clamp(18px,5vw,64px) clamp(14px,4vw,32px)}
.wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:20px}
.kicker{font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:clamp(14px,3vw,18px);display:flex;flex-direction:column;gap:clamp(16px,3vw,20px)}
.card__text{display:flex;flex-direction:column;gap:8px;padding:0 4px clamp(4px,1vw,8px)}
.card__text h1{font-size:clamp(21px,4.4vw,26px);font-weight:800;margin:0;
  letter-spacing:-.015em;color:var(--white);line-height:1.25}
.card__text p{margin:0;font-size:clamp(14px,3vw,15.5px);line-height:1.7;
  color:rgba(255,255,255,.64);font-weight:400}

/* ---------- הבמה — רקע שטוח, בדיוק כמו ההירו ---------- */
.stage-wrap{container-type:inline-size;width:100%}
.stage{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:6px;cursor:pointer;
  background:var(--ground);
  display:grid;grid-template-rows:auto 1fr auto;
  padding-block:5cqw 4.6cqw;padding-inline:6cqw}
.stage:focus-visible{outline:2px solid var(--mint);outline-offset:3px}

/* מחוון השלבים */
.steps{display:flex;align-items:center;justify-content:center;gap:3cqw;
  font-size:3cqw;font-weight:500;letter-spacing:.12em}
.steps .s{position:relative;color:var(--white);opacity:.3}
.steps .s b{position:absolute;inset:0;color:var(--white);font-weight:500;opacity:0}
.steps .link{width:11cqw;height:1px;background:var(--line);transform:scaleX(0);transform-origin:right;opacity:1}

/* ---------- מסגרת האתר ---------- */
.holder{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center}
.frame{position:relative;width:76cqw;border:1px solid var(--line);border-radius:5px;
  background:var(--surface);display:flex;flex-direction:column}
.lift{position:absolute;inset:8% 3% -4% 3%;border-radius:12px;opacity:0;z-index:-1;
  background:radial-gradient(58% 52% at 50% 100%,rgba(0,0,0,.8),transparent 72%);filter:blur(7px)}
.frame__bar{height:4.4cqw;flex:none;border-bottom:1px solid var(--line);border-radius:4px 4px 0 0;
  background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center}
.frame__url{width:23cqw;height:1.6cqw;border-radius:99px;background:var(--line)}
.frame__body{padding:2.4cqw;display:flex;flex-direction:column;gap:1.9cqw}

/* השלד */
.blk{position:relative;border:1px dashed var(--line);border-radius:3px;flex:none;opacity:0;display:flex}
.blk--hero{height:15.5cqw}
.blk--two{height:8.8cqw;align-items:stretch;gap:1.9cqw;padding:1.1cqw}
.blk--three{height:7.2cqw;align-items:stretch;gap:1.4cqw;padding:1.1cqw}
.blk--bar{height:5.8cqw}
.blk--cta{height:12.4cqw}
.blk span{flex:1;border:1px dashed var(--line);border-radius:3px}

/* המילוי */
.fill{position:absolute;inset:-1px;border-radius:3px;opacity:0;display:flex;
  align-items:center;justify-content:center;gap:1.2cqw}
.fill i{font-style:normal;display:block}

/* ההירו של המוקאפ בנוי כמו ההירו שלך: כותרת עליונה דקה,
   כותרת ראשית כבדה שחלק ממנה מסומן במנטה, ושורת גוף — הכל ממורכז */
.fill--hero{background:var(--ground);flex-direction:column;gap:1.5cqw;
  border:1px solid rgba(255,255,255,.08)}
.fill--hero .eyeb{width:17%;height:.8cqw;border-radius:99px;background:rgba(255,255,255,.4)}
.fill--hero .head{display:flex;align-items:center;gap:1cqw}
.fill--hero .head i{height:2.1cqw;border-radius:2px}
.fill--hero .head .w{width:17cqw;background:var(--white)}
.fill--hero .head .m{width:11cqw;background:var(--mint)}
.fill--hero .body{width:44%;height:.85cqw;border-radius:99px;background:rgba(255,255,255,.32)}

.fill--two{background:var(--panel);padding:1.1cqw;gap:1.9cqw}
.fill--two i{flex:1;height:100%;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:3px}
.fill--three{background:var(--panel);padding:1.1cqw;gap:1.4cqw}
.fill--three i{flex:1;height:100%;background:var(--card);border:1px solid rgba(255,255,255,.12);border-radius:3px}
.fill--bar{background:var(--panel);justify-content:flex-start;padding-inline:1.4cqw;gap:1.2cqw}
.fill--bar i{width:3.2cqw;height:3.2cqw;border-radius:99px;background:rgba(255,255,255,.3)}
.fill--bar i+i{width:44%;height:1.1cqw;border-radius:99px}

/* הכפתור — לפי המידות שנמדדו מהאתר */
.fill--cta{background:var(--panel)}
.btn{position:relative;width:34cqw;height:9.8cqw;border-radius:.72cqw;background:var(--mint);
  display:flex;align-items:center;justify-content:center}
.btn i{width:52%;height:1.5cqw;border-radius:99px;background:var(--white)}
.glow{position:absolute;inset:-32% -12%;border-radius:2cqw;opacity:0;pointer-events:none;z-index:-1;
  background:radial-gradient(50% 50% at 50% 50%,rgba(112,211,165,.62),transparent 70%);filter:blur(5px)}

/* ---------- העכבר ---------- */
.cursor{position:absolute;z-index:6;width:5.2cqw;height:5.2cqw;pointer-events:none;
  inset-inline-start:44%;top:11%}
.cursor svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.ripple{position:absolute;z-index:5;width:16cqw;height:16cqw;border-radius:99px;
  border:1px solid var(--mint);opacity:0;translate:-50% -50%;pointer-events:none;
  inset-inline-start:50%;top:50%}

/* ---------- המלל — הטיפוגרפיה של ההירו ---------- */
.caption{text-align:center;margin:0;color:var(--white);isolation:isolate;line-height:1.32}
.caption .ln{display:block}
.caption .l1{font-size:4.2cqw;font-weight:800;letter-spacing:-.02em}
.caption .l2{font-size:3.5cqw;font-weight:300;letter-spacing:.01em;color:rgba(255,255,255,.8)}
.mark{position:relative;display:inline-block}
.mark i{position:absolute;inset:38% -5% -2% -5%;background:var(--mint);z-index:-1;
  transform:scaleX(0);transform-origin:right;opacity:1}

/* ---------- מנוע התזמון ---------- */
.fx{opacity:0}
.stage.is-playing .fx{animation:var(--in,fxRise) var(--dur,.5s) var(--ease) both calc(var(--t0,0) * 1s)}
.stage.is-playing .fx[data-pulse]{animation:
  var(--in,fxRise) var(--dur,.5s) var(--ease) both calc(var(--t0,0) * 1s),
  fxPulse .6s var(--ease) both calc(var(--t2,0) * 1s)}
@keyframes fxRise{from{opacity:0;transform:translateY(1.6cqw)}to{opacity:1;transform:none}}
@keyframes fxFade{from{opacity:0}to{opacity:1}}
@keyframes fxDrop{from{opacity:0;transform:translateY(-2.4cqw) scaleY(.8)}to{opacity:1;transform:none}}
@keyframes fxDraw{from{opacity:1;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes fxPulse{0%{transform:scale(1)}44%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes cursorHit{
  0%{opacity:0;transform:translate(2.6cqw,-5cqw)}
  18%{opacity:1;transform:translate(1.8cqw,0)}
  60%{opacity:1;transform:translate(.6cqw,32cqw)}
  86%{opacity:1;transform:translate(0,50.1cqw)}
  93%{opacity:1;transform:translate(0,48.8cqw)}
  100%{opacity:1;transform:translate(0,50.1cqw)}
}
@keyframes rippleOut{0%{opacity:0;transform:scale(.16)}24%{opacity:.9}100%{opacity:0;transform:scale(1)}}

.meter{height:2px;background:var(--line);position:relative;overflow:hidden;border-radius:99px}
.meter span{position:absolute;inset:0;background:var(--mint);transform:scaleX(0);transform-origin:right}
.meter.is-playing span{animation:meterFill calc(var(--total) * 1s) linear both}
@keyframes meterFill{to{transform:scaleX(1)}}

.foot{display:flex;align-items:center;justify-content:space-between;gap:14px}
.replay{font-family:var(--font);font-size:13px;font-weight:600;color:var(--white);
  background:transparent;border:1px solid var(--line);border-radius:99px;padding:7px 16px;
  cursor:pointer;transition:border-color .18s,color .18s}
.replay:hover{border-color:var(--mint);color:var(--mint)}
.replay:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.foot small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}

@media (prefers-reduced-motion:reduce){
  .stage .fx,.stage.is-playing .fx{animation:none!important}
  .fx{opacity:1;transform:none}
  .cursor,.ripple{display:none}
  .steps .s{opacity:1}.steps .link{transform:scaleX(1)}
  .mark i{transform:scaleX(1)}
  .meter span{animation:none!important;transform:scaleX(1)}
  .replay{display:none}
}
</style>

<div class="wrap" dir="rtl">
  <div class="kicker">reznikdesign.com — כרטיס 1</div>

  <div class="card">
    <div class="stage-wrap">
      <div class="stage" id="stage" style="--total:5.1" role="img" tabindex="0"
           aria-label="אנימציה: קודם כל מאפיינים — שלד האתר נסגר כבלוקים מקווקווים — ואחר כך מעצבים, הצבע נכנס והגולש מגיע לכפתור הפנייה.">

        <div class="steps">
          <span class="s">מאפיינים<b class="fx" style="--t0:.3;--in:fxFade;--dur:.45s">מאפיינים</b></span>
          <span class="link fx" style="--t0:1.7;--in:fxDraw;--dur:.45s"></span>
          <span class="s">מעצבים<b class="fx" style="--t0:2.05;--in:fxFade;--dur:.45s">מעצבים</b></span>
        </div>

        <div class="holder">
          <div class="frame fx" style="--t0:.15;--in:fxFade;--dur:.35s">
            <div class="lift fx" style="--t0:2.4;--in:fxFade;--dur:.8s"></div>
            <div class="frame__bar"><div class="frame__url"></div></div>
            <div class="frame__body">

              <div class="blk blk--hero fx" style="--t0:.35;--in:fxDrop;--dur:.42s">
                <div class="fill fill--hero fx" style="--t0:2.15;--in:fxFade;--dur:.42s">
                  <i class="eyeb"></i>
                  <i class="head"><i class="w"></i><i class="m"></i></i>
                  <i class="body"></i>
                </div>
              </div>

              <div class="blk blk--two fx" style="--t0:.57;--in:fxDrop;--dur:.42s">
                <span></span><span></span>
                <div class="fill fill--two fx" style="--t0:2.3;--in:fxFade;--dur:.42s"><i></i><i></i></div>
              </div>

              <div class="blk blk--three fx" style="--t0:.79;--in:fxDrop;--dur:.42s">
                <span></span><span></span><span></span>
                <div class="fill fill--three fx" style="--t0:2.45;--in:fxFade;--dur:.42s"><i></i><i></i><i></i></div>
              </div>

              <div class="blk blk--bar fx" style="--t0:1.01;--in:fxDrop;--dur:.42s">
                <div class="fill fill--bar fx" style="--t0:2.6;--in:fxFade;--dur:.42s"><i></i><i></i></div>
              </div>

              <div class="blk blk--cta fx" style="--t0:1.23;--in:fxDrop;--dur:.42s">
                <div class="fill fill--cta fx" style="--t0:2.75;--in:fxFade;--dur:.42s">
                  <div class="btn fx" style="--t0:2.8;--t2:4.08;--in:fxFade;--dur:.4s" data-pulse>
                    <div class="glow fx" style="--t0:4.12;--in:fxFade;--dur:.5s"></div>
                    <i></i>
                  </div>
                </div>
                <div class="ripple fx" style="--t0:4.08;--in:rippleOut;--dur:.85s"></div>
              </div>

            </div>

            <div class="cursor" aria-hidden="true">
              <div class="fx" style="--t0:3.05;--in:cursorHit;--dur:1.05s">
                <svg viewBox="0 0 24 24" fill="none"><path d="M5 2.5 19 12.2l-6.1.7-3 5.9z" fill="#FFFFFF" stroke="#0F012F" stroke-width="1.5" stroke-linejoin="round"/></svg>
              </div>
            </div>
          </div>
        </div>

        <p class="caption">
          <span class="ln l1 fx" style="--t0:4.3;--dur:.5s">קודם כל <span class="mark">מאפיינים<i class="fx" style="--t0:4.5;--in:fxDraw;--dur:.42s"></i></span>,</span>
          <span class="ln l2 fx" style="--t0:4.56;--dur:.5s">אחר כך מעצבים</span>
        </p>
      </div>
    </div>

    <div class="card__text">
      <h1>אפיון לפני שנוגעים בעיצוב</h1>
      <p>קודם מבינים את העסק, את קהל היעד ואת המטרה של כל עמוד. המבנה נסגר לפני שנבחר צבע אחד.</p>
    </div>
  </div>

  <div class="meter" id="meter" style="--total:5.1" aria-hidden="true"><span></span></div>
  <div class="foot">
    <button class="replay" id="replay" type="button">נגן שוב</button>
    <small>00:05 · CSS keyframes</small>
  </div>
</div>

<script>
(function(){
  var stage=document.getElementById('stage'),meter=document.getElementById('meter'),
      replay=document.getElementById('replay'),
      reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  function play(){
    if(reduced.matches) return;
    stage.classList.remove('is-playing');meter.classList.remove('is-playing');
    void stage.offsetWidth;
    stage.classList.add('is-playing');meter.classList.add('is-playing');
  }
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){
      if(e.isIntersecting){play();io.disconnect();}});},{threshold:.4});
    io.observe(stage);
  } else { play(); }
  stage.addEventListener('click',play);
  stage.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();play();}});
  replay.addEventListener('click',function(e){e.stopPropagation();play();});
})();
</script>
