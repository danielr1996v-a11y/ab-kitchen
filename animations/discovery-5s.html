:root{
  --shell-bg:#E4E6EA;--shell-fg:#141920;--shell-dim:#5D6673;--shell-line:rgba(20,25,32,.14);
  --card-bg:#FFFFFF;
  /* הבמה נעולה על שפת המותג בכל תמה */
  --vellum:#EFF1F3;--vellum-2:#E6E9ED;--ink:#0E141B;--pencil:#67717F;--rule:#B4BCC6;
  --grid:rgba(24,42,66,.062);--live:#2438E0;--live-soft:rgba(36,56,224,.11);
  --font-display:'Frank Ruhl Libre',Georgia,serif;
  --font-ui:'Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,.72,.26,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --shell-bg:#0B0E12;--shell-fg:#E8EBEF;--shell-dim:#8A939F;--shell-line:rgba(232,235,239,.16);--card-bg:#141920;}}
:root[data-theme="dark"]{
  --shell-bg:#0B0E12;--shell-fg:#E8EBEF;--shell-dim:#8A939F;--shell-line:rgba(232,235,239,.16);--card-bg:#141920;}

*{box-sizing:border-box}
body{margin:0;background:var(--shell-bg);color:var(--shell-fg);font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:flex-start;
  padding:clamp(18px,5vw,64px) clamp(14px,4vw,32px)}
.wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:20px}
.kicker{font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--shell-dim);text-transform:uppercase}

/* ---------- הכרטיס ---------- */
.card{background:var(--card-bg);border:1px solid var(--shell-line);border-radius:6px;
  padding:clamp(14px,3vw,18px);display:flex;flex-direction:column;gap:clamp(16px,3vw,20px)}
.card__text{display:flex;flex-direction:column;gap:8px;padding:0 4px clamp(4px,1vw,8px)}
.card__text h1{font-family:var(--font-display);font-size:clamp(21px,4.4vw,26px);font-weight:700;margin:0;letter-spacing:-.01em}
.card__text p{margin:0;font-size:clamp(14px,3vw,15.5px);line-height:1.7;color:var(--shell-dim)}

/* ---------- הבמה ---------- */
.stage-wrap{container-type:inline-size;width:100%}
.stage{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:4px;cursor:pointer;
  background:
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 4.4cqw,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/4.4cqw 100%,
    var(--vellum);
  color:var(--ink);
  display:grid;grid-template-rows:auto 1fr auto;
  padding-block:5cqw 4.4cqw;padding-inline:6cqw}
.stage:focus-visible{outline:2px solid var(--live);outline-offset:3px}

/* מחוון שני השלבים: מבנה ——— עיצוב */
.steps{display:flex;align-items:center;justify-content:center;gap:3cqw;
  font-size:3.2cqw;font-weight:600;letter-spacing:.06em}
.steps .s{position:relative;color:var(--pencil);opacity:.42}
.steps .s b{position:absolute;inset:0;color:var(--ink);font-weight:600;opacity:0}
.steps .link{width:11cqw;height:1px;background:var(--rule);transform:scaleX(0);transform-origin:right;opacity:1}

/* מסגרת האתר */
.holder{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center}
.frame{position:relative;width:76cqw;border:1px solid var(--rule);border-radius:3px;background:#fff;
  display:flex;flex-direction:column}
.shadow{position:absolute;inset:6% 4% -3% 4%;border-radius:8px;opacity:0;z-index:-1;
  background:radial-gradient(60% 50% at 50% 100%,rgba(14,20,27,.34),transparent 70%);filter:blur(6px)}
.frame__bar{height:4.4cqw;flex:none;border-bottom:1px solid var(--rule);border-radius:2px 2px 0 0;
  background:var(--vellum-2);display:flex;align-items:center;justify-content:center}
.frame__url{width:23cqw;height:1.7cqw;border-radius:99px;background:var(--rule);opacity:.55}
.frame__body{padding:2.4cqw;display:flex;flex-direction:column;gap:1.9cqw}

.blk{position:relative;border:1px dashed var(--rule);border-radius:2px;flex:none;opacity:0;display:flex}
.blk--hero{height:16.5cqw}
.blk--two{height:9.6cqw;align-items:stretch;gap:1.9cqw;padding:1.2cqw}
.blk--three{height:7.8cqw;align-items:stretch;gap:1.5cqw;padding:1.2cqw}
.blk--bar{height:6.4cqw}
.blk--cta{height:8.6cqw}
.blk span{flex:1;border:1px dashed var(--rule);border-radius:2px}

/* המילוי — "אחר כך צבע" */
.fill{position:absolute;inset:-1px;border-radius:2px;opacity:0;display:flex;
  align-items:center;justify-content:center;gap:1.2cqw}
.fill i{font-style:normal;display:block}
.fill--hero{background:var(--ink);flex-direction:column;align-items:flex-start;padding-inline:3.2cqw;gap:1.6cqw}
.fill--hero i{height:1.6cqw;border-radius:99px;background:rgba(255,255,255,.92);width:66%}
.fill--hero i+i{width:40%;opacity:.42}
.fill--two{background:var(--vellum-2);padding:1.2cqw;gap:1.9cqw}
.fill--two i{flex:1;height:100%;background:#fff;border:1px solid var(--rule);border-radius:2px}
.fill--three{background:#fff;padding:1.2cqw;gap:1.5cqw}
.fill--three i{flex:1;height:100%;background:var(--live-soft);border-radius:2px}
.fill--bar{background:var(--vellum-2);justify-content:flex-start;padding-inline:1.4cqw;gap:1.2cqw}
.fill--bar i{width:3.5cqw;height:3.5cqw;border-radius:99px;background:var(--rule)}
.fill--bar i+i{width:46%;height:1.5cqw;border-radius:99px}
.fill--cta{background:var(--live)}
.fill--cta i{width:48%;height:2.4cqw;border-radius:99px;background:#fff}

.caption{text-align:center;font-family:var(--font-display);font-size:3.8cqw;font-weight:400;
  line-height:1.38;margin:0}
.caption span{display:block}
.caption b{font-weight:700}

/* ---------- מנוע התזמון ---------- */
.fx{opacity:0}
.stage.is-playing .fx{animation:var(--in,fxRise) var(--dur,.5s) var(--ease) both calc(var(--t0,0) * 1s)}
.stage.is-playing .fx[data-pulse]{animation:
  var(--in,fxRise) var(--dur,.5s) var(--ease) both calc(var(--t0,0) * 1s),
  fxPulse .6s var(--ease) both calc(var(--t2,0) * 1s)}
@keyframes fxRise{from{opacity:0;transform:translateY(1.6cqw)}to{opacity:1;transform:none}}
@keyframes fxFade{from{opacity:0}to{opacity:1}}
@keyframes fxDrop{from{opacity:0;transform:translateY(-2.4cqw) scaleY(.8)}to{opacity:1;transform:none}}
@keyframes fxDraw{from{opacity:1;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes fxPulse{0%{transform:scale(1)}44%{transform:scale(1.04)}100%{transform:scale(1)}}

/* פס התקדמות עדין מתחת לבמה */
.meter{height:2px;background:var(--shell-line);position:relative;overflow:hidden;border-radius:99px}
.meter span{position:absolute;inset:0;background:var(--live);transform:scaleX(0);transform-origin:right}
.meter.is-playing span{animation:meterFill calc(var(--total) * 1s) linear both}
@keyframes meterFill{to{transform:scaleX(1)}}

.foot{display:flex;align-items:center;justify-content:space-between;gap:14px}
.replay{font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--shell-fg);
  background:transparent;border:1px solid var(--shell-line);border-radius:99px;padding:7px 16px;
  cursor:pointer;transition:border-color .18s,color .18s}
.replay:hover{border-color:var(--live);color:var(--live)}
.replay:focus-visible{outline:2px solid var(--live);outline-offset:3px}
.foot small{font-size:12px;color:var(--shell-dim);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  .stage .fx,.stage.is-playing .fx{animation:none!important}
  .fx{opacity:1;transform:none}
  .steps .s{opacity:1}.steps .s b{opacity:1}.steps .link{transform:scaleX(1)}
  .meter span{animation:none!important;transform:scaleX(1)}
  .replay{display:none}
}

<script>
(function(){
  var stage=document.getElementById('stage'),meter=document.getElementById('meter'),
      replay=document.getElementById('replay'),
      reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  function play(){
    if(reduced.matches) return;
    stage.classList.remove('is-playing');meter.classList.remove('is-playing');
    void stage.offsetWidth;
    stage.classList.add('is-playing');meter.classList.add('is-playing');
  }
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){
      if(e.isIntersecting){play();io.disconnect();}});},{threshold:.4});
    io.observe(stage);
  } else { play(); }
  stage.addEventListener('click',play);
  stage.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();play();}});
  replay.addEventListener('click',function(e){e.stopPropagation();play();});
})();
</script>
