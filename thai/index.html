:root{
  --bg:#EFF1EC; --surface:#FBFCF9; --surface2:#E5EAE1; --sunk:#E9EDE5;
  --ink:#16211D; --muted:#5F6C65; --line:#D6DCD3;
  --accent:#0E6B5C; --accent-soft:#D9EBE5; --accent-ink:#FFFFFF;
  --saffron:#B8770F; --good:#2E7D53; --good-soft:#DCEEE2;
  --bad:#AC4230; --bad-soft:#F6DED9;
  --t0:#6C7C74; --t1:#3A6FA0; --t2:#B24A36; --t3:#AC7412; --t4:#6E52A0;

  --font-th:'Sarabun','Noto Sans Thai','Leelawadee UI','Thonburi',sans-serif;

}
@media (prefers-color-scheme:dark){

    --bg:#0F1613; --surface:#18221E; --surface2:#212D28; --sunk:#131C19;
    --ink:#E6EDE9; --muted:#95A49D; --line:#2B3833;
    --accent:#4FBFA5; --accent-soft:#1B3C36; --accent-ink:#05201A;
    --saffron:#E0A544; --good:#5CC087; --good-soft:#173327;
    --bad:#E07C66; --bad-soft:#3A2019;
    --t0:#93A49D; --t1:#6FA9D6; --t2:#E0836C; --t3:#E0AC4D; --t4:#A98FDB;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#18221E; --surface2:#212D28; --sunk:#131C19;
  --ink:#E6EDE9; --muted:#95A49D; --line:#2B3833;
  --accent:#4FBFA5; --accent-soft:#1B3C36; --accent-ink:#05201A;
  --saffron:#E0A544; --good:#5CC087; --good-soft:#173327;
  --bad:#E07C66; --bad-soft:#3A2019;
  --t0:#93A49D; --t1:#6FA9D6; --t2:#E0836C; --t3:#E0AC4D; --t4:#A98FDB;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-he); font-size:16px; line-height:1.55;
  direction:rtl; -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;min-height:100%}
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  display:flex; align-items:center; gap:10px;
  padding:10px 16px; background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:8px;margin-inline-end:auto;min-width:0}
.brand b{font-weight:700;font-size:1.02rem;letter-spacing:-.01em}
.brand .thmark{font-family:var(--font-th);color:var(--accent);font-size:1.05rem;font-weight:700}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 9px;border-radius:999px;background:var(--surface2);
  font-size:.78rem;font-weight:500;color:var(--muted);white-space:nowrap;
}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.iconbtn{
  display:grid;place-items:center;width:36px;height:36px;flex:0 0 auto;
  border:1px solid var(--line);border-radius:10px;background:var(--surface);
  cursor:pointer;font-size:1rem;
}
.iconbtn:hover{background:var(--surface2)}

main{flex:1;width:100%;max-width:660px;margin:0 auto;padding:18px 16px 108px}

.tabbar{
  position:fixed;inset-inline:0;bottom:0;z-index:20;
  display:flex;justify-content:center;gap:2px;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
}
.tabbar button{
  flex:1 1 0;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border:0;background:none;border-radius:10px;cursor:pointer;
  font-size:.72rem;font-weight:500;color:var(--muted);
}
.tabbar button .ic{font-size:1.15rem;line-height:1}
.tabbar button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}

/* ---------- typography ---------- */
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.12rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
.eyebrow{
  font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-family:var(--font-lat);
}
.sub{color:var(--muted);font-size:.9rem}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel.lift{box-shadow:var(--shadow)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;font-weight:500;
  min-height:44px;
}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{width:100%;padding:15px;font-size:1.05rem}
.btn.ghost{background:none}
.btn.good{background:var(--good-soft);border-color:transparent;color:var(--good);font-weight:700}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad);font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.segmented{display:flex;gap:4px;padding:4px;background:var(--sunk);border-radius:12px;overflow-x:auto;scrollbar-width:none}
.segmented::-webkit-scrollbar{display:none}
.segmented button{
  flex:0 0 auto;padding:8px 13px;border:0;border-radius:9px;background:none;
  cursor:pointer;font-size:.86rem;font-weight:500;color:var(--muted);white-space:nowrap;min-height:38px;
}
.segmented button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}

/* ---------- word rendering ---------- */
.thai{
  font-family:var(--font-th);direction:ltr;unicode-bidi:isolate;
  line-height:1.7;font-weight:500;
}
.thai.xl{font-size:2.4rem;line-height:1.5;overflow-wrap:anywhere}
.thai.lgx{font-size:1.8rem;line-height:1.55;overflow-wrap:anywhere}
.thai.lg{font-size:1.55rem}
.thai.md{font-size:1.18rem}
.translit{color:var(--muted);font-size:.98rem;font-weight:500;letter-spacing:.01em}
.translit .syl{white-space:nowrap}
.translit .sep{opacity:.4}
.tone{font-family:var(--font-lat);font-size:.72em;font-weight:600;vertical-align:.35em;padding-inline-start:1px}
.t0{color:var(--t0)} .t1{color:var(--t1)} .t2{color:var(--t2)} .t3{color:var(--t3)} .t4{color:var(--t4)}
.meaning{font-size:1.05rem;font-weight:500}
.lit{font-size:.82rem;color:var(--muted);font-style:italic}
.hidden-layer{filter:blur(6px);opacity:.55;cursor:pointer;user-select:none}

.speakrow{display:flex;gap:6px}
.speak{
  display:grid;place-items:center;min-width:44px;height:44px;padding:0 12px;
  border:1px solid var(--line);border-radius:11px;background:var(--surface);cursor:pointer;
  font-size:1.05rem;flex:0 0 auto;
}
.speak:hover{background:var(--accent-soft);border-color:var(--accent)}
.speak.slow{font-size:.8rem;font-weight:700;font-family:var(--font-lat);color:var(--muted)}
.speak.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* ---------- lists ---------- */
.items{display:flex;flex-direction:column;gap:8px}
.item{
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;
}
.item .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.item .txt>*{overflow-wrap:anywhere}
.star{border:0;background:none;cursor:pointer;font-size:1.05rem;padding:6px;line-height:1;opacity:.35;min-height:38px}
.star.on{opacity:1}

/* ---------- misc ---------- */
.notice{
  display:flex;gap:10px;align-items:flex-start;
  background:var(--surface2);border:1px solid var(--line);border-left:0;border-right:3px solid var(--saffron);
  border-radius:10px;padding:12px 14px;font-size:.88rem;
}
.notice b{display:block;margin-bottom:3px}
.notice ul{margin:6px 0 0;padding-inline-start:18px}
.notice li{margin:2px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:center}
.stat .n{font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .l{font-size:.74rem;color:var(--muted)}
.progress{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--bad-soft);color:var(--bad)}
.divider{height:1px;background:var(--line);border:0;margin:0}
.empty{text-align:center;color:var(--muted);padding:34px 12px}
.empty .big{font-size:2rem;display:block;margin-bottom:6px}

/* ---------- dialogue ---------- */
.line{display:flex;gap:10px;align-items:flex-start;padding:11px 0}
.line+.line{border-top:1px solid var(--line)}
.who{
  flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-size:.72rem;font-weight:700;background:var(--surface2);color:var(--muted);margin-top:3px;
}
.line.me .who{background:var(--accent-soft);color:var(--accent)}
.line .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

/* ---------- sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,17,.45);z-index:40;display:grid;place-items:end center}
.sheet{
  width:100%;max-width:660px;background:var(--surface);border-radius:18px 18px 0 0;
  padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));
  max-height:86vh;overflow-y:auto;box-shadow:0 -10px 40px -18px rgba(0,0,0,.5);
}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0}
.setting+.setting{border-top:1px solid var(--line)}
.setting .lab{font-size:.94rem}
.setting .lab small{display:block;color:var(--muted);font-size:.78rem}
.switch{position:relative;width:48px;height:28px;flex:0 0 auto;border:0;border-radius:999px;background:var(--sunk);cursor:pointer;transition:background .2s}
.switch i{position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] i{transform:translateX(-20px)}

@media (max-width:430px){
  .thai.xl{font-size:2rem}
  main{padding:14px 14px 104px}
  .tabbar button{font-size:.68rem}
}

const defaults = () => ({
  v:1, ts:0, gender:"m", theme:"auto",

const todayStr = () => new Date().toLocaleDateString("sv-SE");
const addDays = (n) => { const d=new Date(); d.setDate(d.getDate()+n); return d.toLocaleDateString("sv-SE"); };

function readLocal(){
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function adopt(obj){
  if(!obj || typeof obj!=="object") return;
  const base = defaults();
  state = Object.assign(base, obj, {
    srs:Object.assign({},obj.srs||{}),
    star:Object.assign({},obj.star||{}),
    today:Object.assign(base.today,obj.today||{}),
    streak:Object.assign(base.streak,obj.streak||{}),
    toneStats:Object.assign({},obj.toneStats||{})
  });
}
adopt(readLocal());

let remoteDoc = null, saveTimer = null;
function save(){
  state.ts = Date.now();
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    if(!remoteDoc) return;
    try{ Promise.resolve(remoteDoc.set(JSON.parse(JSON.stringify(state)))).catch(()=>{}); }catch(e){}
  }, 1200);
}
async function initRemote(){
  try{
    const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if(!db) return;
    remoteDoc = db.doc("progress/main");
    const snap = await remoteDoc.get();
    const data = snap && (snap.data || snap.value || (snap.exists===false ? null : snap));
    if(data && typeof data==="object" && (data.ts||0) > (state.ts||0)){
      adopt(data); render();
    }else if(state.ts){ save(); }
  }catch(e){ /* ממשיכים עם אחסון מקומי */ }
}

let thVoice=null, voicesChecked=false, speaking=null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const all = window.speechSynthesis.getVoices() || [];
  if(!all.length) return;
  const th = all.filter(v => (v.lang||"").toLowerCase().replace("_","-").startsWith("th"));
  thVoice = th.find(v=>v.localService) || th[0] || null;
  voicesChecked = true;
}
if("speechSynthesis" in window){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = () => { pickVoice(); updateVoiceNotice(); };
  setTimeout(()=>{ pickVoice(); voicesChecked=true; updateVoiceNotice(); }, 1600);
}
const voiceReady = () => !!thVoice;

let warmed=false;
function warmUp(){
  if(warmed || !("speechSynthesis" in window)) return;
  warmed = true;
  try{ const u=new SpeechSynthesisUtterance(" "); u.volume=0; window.speechSynthesis.speak(u); }catch(e){}
}
document.addEventListener("pointerdown", warmUp, {once:true});

function speak(text, slow){
  if(!("speechSynthesis" in window)) return;
  warmUp();
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "th-TH";
    if(thVoice) u.voice = thVoice;
    u.rate = slow ? 0.5 : 0.92;
    u.pitch = 1;
    window.speechSynthesis.speak(u);
    speaking = u;
  }catch(e){}
}
function speakSeq(texts, i){
  i = i||0;
  if(i>=texts.length || !("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(texts[i]);
  u.lang="th-TH"; if(thVoice) u.voice=thVoice; u.rate=0.88;
  u.onend = () => setTimeout(()=>speakSeq(texts,i+1), 380);
  window.speechSynthesis.speak(u);
}

  return {
    th:   hasP ? item.raw.replace("~", particle()) : item.raw,

  };

const ITEMS = [];
const GROUPS = [];
(function build(){
  const seen = {};
  const push = (kind, group, label, icon, row) => {
    let id = row[0];
    if(seen[id]) id = id + "#" + (++seen[row[0]]);
    else seen[row[0]] = 1;
    const it = {id, kind, group, groupLabel:label, icon, raw:row[0], he:row[1], t:row[2], mean:row[3]};
    ITEMS.push(it);
    return it;
  };
  PHRASES.forEach(g=>{
    const list = g.items.map(r=>push("p", g.key, g.label, g.icon, r));
    GROUPS.push({key:g.key, label:g.label, icon:g.icon, kind:"p", items:list});
  });
  VOCAB.forEach(g=>{
    const list = g.items.map(r=>push("w", g.key, g.label, g.icon, r));
    GROUPS.push({key:g.key, label:g.label, icon:g.icon, kind:"w", items:list});
  });
})();

function cardState(id){ return state.srs[id] || null; }
function isDue(id){
  const c = cardState(id);
  if(!c) return false;
  return c.d <= todayStr();
}
function dueItems(){ return ITEMS.filter(i=>isDue(i.id)); }
function newItems(){ return ITEMS.filter(i=>!cardState(i.id)); }
function newLeftToday(){
  if(state.today.date !== todayStr()){ state.today = {date:todayStr(), newN:0}; }
  return Math.max(0, state.newPerDay - state.today.newN);
}
function knownCount(){ return Object.values(state.srs).filter(c=>c.b>=4).length; }
function learningCount(){ return Object.values(state.srs).filter(c=>c.b<4).length; }

function answerCard(id, ok){
  const prev = cardState(id);
  if(!prev){
    if(state.today.date !== todayStr()) state.today = {date:todayStr(), newN:0};
    state.today.newN++;
  }
  const box = prev ? prev.b : 1;
  const next = ok ? Math.min(5, box+1) : 1;
  state.srs[id] = { b:next, d: addDays(ok ? BOX_DAYS[next-1] : 0) };
  bumpStreak();
  save();
}
function bumpStreak(){
  const t = todayStr();
  if(state.streak.last === t) return;
  state.streak.n = (state.streak.last === addDays(-1)) ? state.streak.n+1 : 1;
  state.streak.last = t;
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function translitHTML(he, t){
  const syl = String(he).split("־");
  const tones = String(t||"");
  const parts = syl.map((s,i)=>{
    const d = tones[i];
    const g = (d!==undefined && +d>0 && TONE_GLYPH[+d]!==undefined)
      ? '<span class="tone t'+(+d)+'" aria-hidden="true">'+TONE_GLYPH[+d]+'</span>' : "";
    return '<span class="syl">'+esc(s)+g+'</span>';
  });
  return parts.join('<span class="sep" aria-hidden="true">־</span>');
}

function mixed(s){
  return esc(s).replace(/[\u0E00-\u0E7F]+/g, m => '<span dir="ltr" style="unicode-bidi:isolate">'+m+'</span>');
}
function thSize(text){ return text.length > 16 ? "lgx" : "xl"; }

function speakBtns(text, extraClass){
  return '<div class="speakrow'+(extraClass?" "+extraClass:"")+'">'
    + '<button class="speak" data-say="'+esc(text)+'" aria-label="השמע">🔊</button>'
    + '<button class="speak slow" data-say="'+esc(text)+'" data-slow="1" aria-label="השמע לאט">לאט</button>'
    + '</div>';
}

function itemRow(it, opts){
  opts = opts || {};
  const r = resolve(it);
  const starred = !!state.star[it.id];
  const c = cardState(it.id);
  return '<div class="item" data-id="'+esc(it.id)+'">'
    + '<div class="txt">'
      + '<div class="thai md">'+esc(r.th)+'</div>'
      + (state.showTranslit ? '<div class="translit">'+translitHTML(r.he,r.t)+'</div>' : "")
      + (state.showMean ? '<div class="meaning">'+esc(r.mean)+'</div>' : "")
      + (opts.showBox && c ? '<div class="lit">קופסה '+c.b+' · חזרה '+c.d+'</div>' : "")
    + '</div>'
    + '<div class="row" style="flex-wrap:nowrap;gap:4px">'
      + '<button class="star'+(starred?" on":"")+'" data-star="'+esc(it.id)+'" aria-label="סמן כקשה" aria-pressed="'+starred+'">★</button>'
      + speakBtns(r.th)
    + '</div>'
  + '</div>';
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(arr,n,exclude){
  const pool = arr.filter(x=>x!==exclude);
  return shuffle(pool).slice(0,n);
}

    return '<div class="empty"><span class="big">✓</span>'
      + '<p>אין כרטיסים לחזרה כרגע.</p>'
      + '<div class="row" style="justify-content:center">'
      + '<button class="btn" data-flash="starred">תרגל את המסומנים ★</button>'
      + '<button class="btn" data-flash="random">20 כרטיסים אקראיים</button>'
      + '</div></div>';
  }
  const it = byId[flash.queue[0]];
  const r = resolve(it);
  const c = cardState(it.id);
  const pct = flash.total ? Math.round(100*flash.done/flash.total) : 0;

  return '<div class="stack">'
    + '<div class="progress"><i style="width:'+pct+'%"></i></div>'
    + '<div class="row" style="justify-content:space-between">'
      + '<span class="sub">נותרו '+flash.queue.length+'</span>'
      + '<span class="pill">'+(c ? "קופסה "+c.b : "חדש")+'</span>'
    + '</div>'
    + '<section class="panel lift stack" style="gap:14px;align-items:center;text-align:center;padding:26px 18px">'
      + '<div class="thai '+thSize(r.th)+'">'+esc(r.th)+'</div>'
      + speakBtns(r.th)
      + (flash.revealed
          ? '<div class="stack" style="gap:6px;align-items:center">'
            + '<div class="translit" style="font-size:1.05rem">'+translitHTML(r.he,r.t)+'</div>'
            + '<div class="meaning" style="font-size:1.25rem;font-weight:700">'+esc(r.mean)+'</div>'
            + '<div class="lit">'+esc(it.groupLabel)+'</div>'
          + '</div>'
          : '<button class="btn big" data-reveal="1">גלה תשובה</button>')
    + '</section>'
    + (flash.revealed
        ? '<div class="row" style="flex-wrap:nowrap">'
          + '<button class="btn bad" data-ans="0" style="flex:1">לא ידעתי</button>'
          + '<button class="btn good" data-ans="1" style="flex:1">ידעתי</button>'
        + '</div>'
        : '')
    + '<div class="row" style="justify-content:center">'
      + '<button class="star'+(state.star[it.id]?" on":"")+'" data-star="'+esc(it.id)+'" aria-pressed="'+(!!state.star[it.id])+'">★ קשה לי</button>'
    + '</div>'
  + '</div>';
}

/* ---------- תרגול: חידון והאזנה ---------- */
let quiz = null;
function scopePool(){
  if(route.quizScope==="all") return ITEMS;
  if(route.quizScope==="star") return ITEMS.filter(i=>state.star[i.id]);
  if(route.quizScope==="learning") return ITEMS.filter(i=>cardState(i.id));
  const g = GROUPS.find(x=>x.key===route.quizScope);
  return g ? g.items : ITEMS;
}
function nextQuestion(listen){
  const pool = scopePool();
  if(pool.length < 4) return null;
  const target = pool[Math.floor(Math.random()*pool.length)];
  const others = sample(pool, 3, target);
  const dir = listen ? "listen" : (Math.random()<0.5 ? "he2th" : "th2he");
  return {target, options: shuffle([target].concat(others)), dir, picked:null};
}
function startQuiz(listen){
  quiz = {listen:!!listen, q:null, score:0, run:0, best:state.quizBest, n:0};
  quiz.q = nextQuestion(listen);
}
function viewQuiz(listen){
  if(!quiz || quiz.listen!==!!listen) startQuiz(listen);
  const scopes = [{key:"all",label:"הכל"},{key:"learning",label:"בלמידה"},{key:"star",label:"מסומן ★"}]
    .concat(GROUPS.map(g=>({key:g.key,label:g.label})));
  const head = '<div class="segmented">' + scopes.map(s =>
      '<button data-scope="'+s.key+'" aria-pressed="'+(route.quizScope===s.key)+'">'+s.label+'</button>').join("") + '</div>';

  if(listen && !voiceReady()) return '<div class="stack">'+head+voiceNoticeHTML(true)+'</div>';
  if(!quiz.q) return '<div class="stack">'+head+'<div class="empty">צריך לפחות 4 פריטים בקבוצה הזאת לחידון.</div></div>';

  const q = quiz.q, r = resolve(q.target);
  const prompt = q.dir==="listen"
    ? '<div class="stack" style="gap:12px;align-items:center">'
      + '<button class="speak on" data-say="'+esc(r.th)+'" style="width:90px;height:90px;border-radius:50%;font-size:2rem">🔊</button>'
      + '<button class="btn ghost" data-say="'+esc(r.th)+'" data-slow="1" style="min-height:36px;padding:6px 14px">השמע לאט</button>'
      + '</div>'
    : q.dir==="th2he"
      ? '<div class="stack" style="gap:10px;align-items:center"><div class="thai '+thSize(r.th)+'">'+esc(r.th)+'</div>'+speakBtns(r.th)+'</div>'
      : '<div class="meaning" style="font-size:1.5rem;font-weight:700;text-align:center">'+esc(r.mean)+'</div>';

  const optHTML = q.options.map(o=>{
    const ro = resolve(o);
    const label = (q.dir==="he2th")
      ? '<span class="thai md">'+esc(ro.th)+'</span>'+(state.showTranslit?' <span class="translit">'+translitHTML(ro.he,ro.t)+'</span>':"")
      : esc(ro.mean);
    let cls = "btn";
    if(q.picked){
      if(o.id===q.target.id) cls += " good";
      else if(o.id===q.picked) cls += " bad";
    }
    return '<button class="'+cls+'" data-opt="'+esc(o.id)+'" style="width:100%;justify-content:center;text-align:center">'+label+'</button>';
  }).join("");

  return '<div class="stack">'
    + head
    + '<div class="row" style="justify-content:space-between">'
      + '<span class="chip">ניקוד <b>'+quiz.score+'</b> מתוך <b>'+quiz.n+'</b></span>'
      + '<span class="chip">רצף <b>'+quiz.run+'</b> · שיא <b>'+Math.max(state.quizBest,quiz.run)+'</b></span>'
    + '</div>'
    + '<section class="panel lift" style="padding:24px 18px">'+prompt+'</section>'
    + '<div class="stack" style="gap:8px">'+optHTML+'</div>'
    + (q.picked
        ? '<section class="panel stack" style="gap:6px">'
          + '<div class="thai lg">'+esc(r.th)+'</div>'
          + '<div class="translit">'+translitHTML(r.he,r.t)+'</div>'
          + '<div class="meaning">'+esc(r.mean)+'</div>'
          + '<button class="btn primary big" data-next="1">הבא</button>'
        + '</section>'
        : '')
  + '</div>';
}

/* ---------- שיחות ---------- */
function viewTalk(){
  if(!route.dialog){
    return '<div class="stack">'
      + '<h2>שיחות לפי מצב</h2>'
      + '<p class="sub" style="margin:0">כל שיחה בנויה ממשפטים שכבר קיימים באוצר המילים. השורות שלך מסומנות ב־<b>אתה</b>.</p>'
      + '<div class="items">' + DIALOGS.map(d =>
          '<button class="item" data-dialog="'+d.key+'" style="text-align:start;cursor:pointer;width:100%">'
          + '<div class="txt"><div class="meaning">'+d.icon+' '+esc(d.label)+'</div>'
          + '<div class="lit">'+d.lines.length+' שורות</div></div><div class="sub">‹</div></button>'
        ).join("") + '</div>'
    + '</div>';
  }
  const d = DIALOGS.find(x=>x.key===route.dialog);
  const lines = d.lines.map(l=>{
    const it = {raw:l[1], he:l[2], t:l[3], mean:l[4]};
    const r = resolve(it);
    const me = l[0]==="me";
    return '<div class="line'+(me?" me":"")+'">'
      + '<div class="who">'+(me?"אתה":"הם")+'</div>'
      + '<div class="body">'
        + '<div class="thai md">'+esc(r.th)+'</div>'
        + (state.showTranslit?'<div class="translit">'+translitHTML(r.he,r.t)+'</div>':"")
        + (state.showMean?'<div class="meaning" style="font-size:.96rem">'+esc(r.mean)+'</div>':"")
      + '</div>'
      + '<button class="speak" data-say="'+esc(r.th)+'" aria-label="השמע">🔊</button>'
    + '</div>';
  }).join("");
  const all = d.lines.map(l=>resolve({raw:l[1],he:l[2],t:l[3],mean:l[4]}).th);

  return '<div class="stack">'
    + '<button class="btn ghost" data-dialog="" style="align-self:flex-start;min-height:38px;padding:6px 12px">› כל השיחות</button>'
    + '<h2>'+d.icon+' '+esc(d.label)+'</h2>'
    + '<div class="row">'
      + '<button class="btn" data-seq="'+esc(all.join("|"))+'">▶ השמע את כל השיחה</button>'
      + '<button class="btn ghost" data-toggle="showMean" style="padding:7px 12px;min-height:38px">'+(state.showMean?"הסתר תרגום":"הצג תרגום")+'</button>'
    + '</div>'
    + '<section class="panel">'+lines+'</section>'
  + '</div>';
}

/* ---------- טונים ---------- */
let toneQ = null;
function nextTone(){
  const set = TONE_SETS[Math.floor(Math.random()*TONE_SETS.length)];
  const target = set.items[Math.floor(Math.random()*set.items.length)];
  toneQ = {set, target, picked:null};
}
function viewTones(){
  const legend = '<div class="panel stack" style="gap:8px">'
    + '<span class="eyebrow">חמשת הטונים</span>'
    + '<div class="row" style="gap:12px">' + TONE_NAME.map((n,i)=>
        '<span><span class="tone t'+i+'" style="font-size:1.1rem;vertical-align:0">'+TONE_GLYPH[i]+'</span> '+n+(i===0?" (ללא סימן)":"")+'</span>').join("") + '</div>'
    + '<p class="sub" style="margin:0">הסימן מופיע אחרי כל הברה בתעתיק. בתאית הטון הוא חלק מהמילה — מילה באותו תעתיק ובטון אחר היא מילה אחרת לגמרי.</p>'
  + '</div>';

  const stats = Object.keys(state.toneStats).length
    ? '<div class="stats" style="grid-template-columns:repeat(5,1fr);gap:5px">' + TONE_NAME.map((n,i)=>{
        const s = state.toneStats[i] || {ok:0,n:0};
        const p = s.n ? Math.round(100*s.ok/s.n) : 0;
        return '<div class="stat" style="padding:9px 4px"><div class="n" style="font-size:1.02rem">'+(s.n?p+"%":"—")+'</div><div class="l" style="font-size:.67rem">'+n+'</div></div>';
      }).join("") + '</div>'
    : "";

  let quizHTML = "";
  if(!voiceReady()){
    quizHTML = voiceNoticeHTML(true);
  }else{
    if(!toneQ) nextTone();
    const opts = toneQ.set.items.map(o=>{
      let cls="btn";
      if(toneQ.picked){
        if(o[0]===toneQ.target[0]) cls+=" good";
        else if(o[0]===toneQ.picked) cls+=" bad";
      }
      return '<button class="'+cls+'" data-tone="'+esc(o[0])+'" style="width:100%;justify-content:space-between">'
        + '<span class="thai md">'+esc(o[0])+'</span>'
        + '<span>'+translitHTML(o[1],o[2])+'</span>'
        + '<span class="sub">'+esc(o[3])+'</span></button>';
    }).join("");
    quizHTML = '<section class="stack" style="gap:10px">'
      + '<div class="row" style="justify-content:space-between"><h2>איזו מילה שמעת?</h2>'
      + '<span class="pill">'+mixed(toneQ.set.title)+'</span></div>'
      + '<div class="panel lift" style="display:grid;place-items:center;padding:22px">'
        + '<button class="speak on" data-say="'+esc(toneQ.target[0])+'" style="width:86px;height:86px;border-radius:50%;font-size:1.9rem">🔊</button>'
        + '<button class="btn ghost" data-say="'+esc(toneQ.target[0])+'" data-slow="1" style="margin-top:10px;min-height:36px;padding:6px 14px">לאט</button>'
      + '</div>'
      + '<div class="stack" style="gap:8px">'+opts+'</div>'
      + (toneQ.picked ? '<button class="btn primary big" data-tonenext="1">הבא</button>' : "")
    + '</section>';
  }

  const pron = PRON_SETS.map(s =>
    '<section class="panel stack" style="gap:8px">'
    + '<h3>'+mixed(s.title)+'</h3>'
    + '<div class="items">' + s.items.map(i =>
        '<div class="item"><div class="txt">'
        + '<div class="thai md">'+esc(i[0])+'</div>'
        + '<div class="translit">'+translitHTML(i[1],i[2])+'</div>'
        + '<div class="meaning">'+esc(i[3])+'</div></div>'
        + speakBtns(i[0]) + '</div>').join("") + '</div>'
  + '</section>').join("");

  const key = '<section class="panel stack" style="gap:6px">'
    + '<span class="eyebrow">מקרא התעתיק</span>'
    + '<p class="sub" style="margin:0">ק=k · כ=kh נשוף · ט=t · ת=th נשוף · פּ=p · פ=ph נשוף / f · בּ=b · ג׳=j · צ׳=ch · נג=ng. '
    + 'ההבדל בין נשוף ללא־נשוף חשוב: הקשב לזוגות למטה.</p>'
  + '</section>';

  return '<div class="stack">' + legend + stats + quizHTML
    + '<h2 style="margin-top:6px">הגייה שקשה לדוברי עברית</h2>' + key + pron + '</div>';
}

/* ---------- תרגול: מעטפת ---------- */
function viewDrill(){
  const modes = [{k:"flash",l:"כרטיסיות"},{k:"quiz",l:"חידון"},{k:"listen",l:"האזנה"}];
  const head = '<div class="segmented">' + modes.map(m =>
    '<button data-mode="'+m.k+'" aria-pressed="'+(route.mode===m.k)+'">'+m.l+'</button>').join("") + '</div>';
  const body = route.mode==="flash" ? viewFlash()
             : route.mode==="quiz"  ? viewQuiz(false)
             : viewQuiz(true);
  return '<div class="stack">'+head+body+'</div>';
}

function render(){
  renderTabs();
  const el = route.tab==="home" ? viewHome()
           : route.tab==="learn" ? viewLearn()
           : route.tab==="drill" ? viewDrill()
           : route.tab==="talk" ? viewTalk()
           : viewTones();
  view.innerHTML = el;
  const chip = document.getElementById("streakChip");
  chip.hidden = !state.streak.n;
  document.getElementById("streakN").textContent = state.streak.n;
  window.scrollTo({top:0, behavior:"instant"});
}
function updateVoiceNotice(){
  if(document.getElementById("voiceNotice") || route.tab==="tones" || route.mode==="listen") render();
}

/* ============================================================
   אירועים
   ============================================================ */
function reRender(reset){
  const y = window.scrollY;
  render();
  if(!reset) window.scrollTo(0, y);
}

document.addEventListener("click", (e)=>{
  const t = e.target.closest("[data-say],[data-star],[data-tab],[data-go],[data-group],[data-toggle],"
    + "[data-playall],[data-mode],[data-reveal],[data-ans],[data-flash],[data-scope],[data-opt],"
    + "[data-next],[data-dialog],[data-seq],[data-tone],[data-tonenext],[data-set],[data-theme-set],[data-close],[data-reset]");
  if(!t) return;
  const d = t.dataset;

  if(d.say !== undefined){ speak(d.say, d.slow==="1"); return; }

  if(d.star !== undefined){
    state.star[d.star] = !state.star[d.star];
    if(!state.star[d.star]) delete state.star[d.star];
    save(); reRender(); return;
  }
  if(d.tab !== undefined){ route.tab = d.tab; route.dialog = null; render(); return; }
  if(d.go !== undefined){
    const [tab, sub] = d.go.split(":");
    route.tab = tab;
    if(tab==="drill" && sub) route.mode = sub;
    if(tab==="learn" && sub) route.group = sub;
    render(); return;
  }
  if(d.group !== undefined){ route.group = d.group; render(); return; }
  if(d.toggle !== undefined){
    state[d.toggle] = !state[d.toggle]; save(); reRender();
    if(document.getElementById("sheetBg")) openSettings();
    return;
  }
  if(d.playall !== undefined){
    const g = GROUPS.find(x=>x.key===d.playall);
    if(g) speakSeq(g.items.map(i=>resolve(i).th));
    return;
  }
  if(d.mode !== undefined){ route.mode = d.mode; render(); return; }

  if(d.reveal !== undefined){ flash.revealed = true; reRender(); return; }
  if(d.ans !== undefined){
    const id = flash.queue[0], ok = d.ans==="1";
    answerCard(id, ok);
    flash.queue.shift();
    if(!ok) flash.queue.push(id); else flash.done++;
    flash.revealed = false;
    reRender(true); return;
  }
  if(d.flash !== undefined){
    const pool = d.flash==="starred"
      ? ITEMS.filter(i=>state.star[i.id])
      : shuffle(ITEMS).slice(0,20);
    flash = {queue: shuffle(pool.map(i=>i.id)), done:0, total:pool.length, revealed:false};
    reRender(true); return;
  }

  if(d.scope !== undefined){ route.quizScope = d.scope; startQuiz(route.mode==="listen"); reRender(true); return; }
  if(d.opt !== undefined){
    if(quiz.q.picked) return;
    quiz.q.picked = d.opt;
    quiz.n++;
    const ok = d.opt === quiz.q.target.id;
    if(ok){ quiz.score++; quiz.run++; if(quiz.run>state.quizBest){ state.quizBest = quiz.run; } }
    else quiz.run = 0;
    answerCard(quiz.q.target.id, ok);
    if(!ok) speak(resolve(quiz.q.target).th);
    reRender(); return;
  }
  if(d.next !== undefined){
    quiz.q = nextQuestion(quiz.listen);
    reRender(true);
    if(quiz.listen && quiz.q) setTimeout(()=>speak(resolve(quiz.q.target).th), 250);
    return;
  }

  if(d.dialog !== undefined){ route.dialog = d.dialog || null; render(); return; }
  if(d.seq !== undefined){ speakSeq(d.seq.split("|")); return; }

  if(d.tone !== undefined){
    if(toneQ.picked) return;
    toneQ.picked = d.tone;
    const tone = +toneQ.target[2];
    const s = state.toneStats[tone] || {ok:0,n:0};
    s.n++; if(d.tone===toneQ.target[0]) s.ok++;
    state.toneStats[tone] = s;
    bumpStreak(); save(); reRender(); return;
  }
  if(d.tonenext !== undefined){
    nextTone(); reRender(true);
    setTimeout(()=>speak(toneQ.target[0]), 250);
    return;
  }

  if(d.set !== undefined){
    const [k,v] = d.set.split(":");
    state[k] = (k==="newPerDay") ? +v : v;
    save(); openSettings(); reRender(); return;
  }
  if(d.themeSet !== undefined){
    state.theme = d.themeSet; applyTheme(); save(); openSettings(); return;
  }
  if(d.close !== undefined){ closeSettings(); return; }
  if(d.reset !== undefined){
    if(confirm("לאפס את כל ההתקדמות? הפעולה לא הפיכה.")){
      state = defaults(); applyTheme(); save(); flash=null; quiz=null; toneQ=null;
      closeSettings(); render();
    }
    return;
  }
});

/* ============================================================
   הגדרות
   ============================================================ */
function applyTheme(){
  const th = state.theme || "auto";
  if(th==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", th);
}
function sw(key, label, note){
  const on = !!state[key];
  return '<div class="setting"><div class="lab">'+label+(note?'<small>'+note+'</small>':"")+'</div>'
    + '<button class="switch" role="switch" aria-checked="'+on+'" aria-label="'+label+'" data-toggle="'+key+'"><i></i></button></div>';
}
function openSettings(){
  closeSettings();
  const seg = (name, opts, cur, attr) => '<div class="segmented" style="flex:0 0 auto">'
    + opts.map(o=>'<button '+attr+'="'+o.v+'" aria-pressed="'+(cur===o.v)+'">'+o.l+'</button>').join("") + '</div>';

  const html = '<div class="sheet-bg" id="sheetBg" data-close="1">'
    + '<div class="sheet" role="dialog" aria-label="הגדרות" onclick="event.stopPropagation()">'
      + '<div class="row" style="justify-content:space-between;margin-bottom:6px">'
        + '<h2>הגדרות</h2><button class="iconbtn" data-close="1" aria-label="סגור">✕</button></div>'

      + '<div class="setting"><div class="lab">חלקיק נימוס<small>ครับ לגבר · ค่ะ לאישה — משנה גם את ההקראה</small></div>'
        + seg("gender",[{v:"gender:m",l:"ครับ"},{v:"gender:f",l:"ค่ะ"}], "gender:"+state.gender, "data-set") + '</div>'

      + sw("showTranslit","הצג תעתיק עברי")
      + sw("showMean","הצג תרגום")

      + '<div class="setting"><div class="lab">מילים חדשות ביום<small>נשארו היום: '+newLeftToday()+'</small></div>'
        + seg("newPerDay",[5,10,20,30,50].map(n=>({v:"newPerDay:"+n,l:String(n)})), "newPerDay:"+state.newPerDay, "data-set") + '</div>'

      + '<div class="setting"><div class="lab">ערכת נושא</div>'
        + seg("theme",[{v:"auto",l:"אוטומטי"},{v:"light",l:"בהיר"},{v:"dark",l:"כהה"}], state.theme||"auto", "data-theme-set") + '</div>'

      + '<div class="setting"><div class="lab">בדיקת קול<small>'
        + (voiceReady() ? "נמצא קול תאי: "+esc(thVoice.name||"th-TH") : "לא נמצא קול תאי במכשיר")
        + '</small></div><button class="btn" data-say="สวัสดีครับ ยินดีต้อนรับ">🔊 נסה</button></div>'

      + '<div class="setting"><div class="lab">התקדמות<small>'
        + (remoteDoc ? "מסתנכרנת בין המכשירים שלך" : "נשמרת בדפדפן הזה")
        + '</small></div><button class="btn bad" data-reset="1">איפוס</button></div>'

      + '<p class="sub" style="margin:14px 0 0;font-size:.8rem">התוכן נכתב לפי תאית מדוברת יומיומית. שווה לאמת מול דובר יליד לפני שנשענים על משפט חשוב.</p>'
    + '</div></div>';
  document.body.insertAdjacentHTML("beforeend", html);
}
function closeSettings(){
  const s = document.getElementById("sheetBg");
  if(s) s.remove();
}
document.getElementById("btnSettings").addEventListener("click", openSettings);
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeSettings(); });

/* ============================================================
   הפעלה
   ============================================================ */
applyTheme();
if(state.today.date !== todayStr()) state.today = {date:todayStr(), newN:0};
render();
initRemote();
</script>
